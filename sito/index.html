<!doctype html>
<html lang="%CLIENTE_LINGUA%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- SEO generata da config/cliente.config.ts (config/seo-head.ts) -->
    <!--cliente:seo-->
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Rete di sicurezza: se l'app non parte entro 8 secondi (connessione lenta o script bloccato),
      // riprova una volta in automatico, poi mostra un messaggio con il motivo invece dello schermo nero.
      (function () {
        var errori = [];
        function nota(m) { errori.push(String(m).slice(0, 160)); }
        window.addEventListener('error', function (e) { nota((e.message || 'errore') + (e.target && e.target.src ? ' ' + e.target.src : '')); }, true);
        window.addEventListener('unhandledrejection', function (e) { nota(e.reason && e.reason.message ? e.reason.message : e.reason); });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childNodes.length) return;
          var gia = false;
          try { gia = sessionStorage.getItem('riprovato') === '1'; sessionStorage.setItem('riprovato', '1'); } catch (x) {}
          if (!gia) { location.reload(); return; }
          document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#000;color:#fff;font-family:system-ui,sans-serif;text-align:center">' +
            '<p style="margin:0;font-size:16px">Il sito non si è caricato. Controlla la connessione e riprova.</p>' +
            '<button onclick="location.reload()" style="padding:12px 22px;border:0;border-radius:8px;background:#f26a21;color:#fff;font-size:15px;font-weight:700">Ricarica</button>' +
            '<p style="margin:0;font-size:11px;color:#777;max-width:320px;word-break:break-all">' + (errori.join(" | ") || "nessun errore registrato") + '</p></div>';
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
